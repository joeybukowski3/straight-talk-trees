name: Validate

on:
  pull_request:
  push:
    branches:
      - feat/launch-readiness-and-seo-foundation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Full repository lint baseline
        continue-on-error: true
        run: npm run lint
      - name: Launch code lint
        run: >-
          npx eslint
          src/components/site/ContactForm.tsx
          src/components/site/EmergencyBar.tsx
          src/components/site/FinalCTA.tsx
          src/components/site/Footer.tsx
          src/components/site/Header.tsx
          src/components/site/Hero.tsx
          src/lib/analytics.ts
          src/lib/contact.functions.ts
          src/lib/site-config.ts
          src/routes/__root.tsx
          src/routes/index.tsx
          src/routes/privacy.tsx
          src/routes/terms.tsx
          --rule 'prettier/prettier: off'
      - name: Build and generate routes
        run: npm run build
      - name: TypeScript
        run: npm run typecheck
